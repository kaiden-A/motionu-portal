<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Motion-U Portals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">M</span>
      <span class="auth-brand__name">Motion-U <span class="brand-sub">PORTALS</span></span>
    </div>
    <h1 class="h-lg mt-16">Sign in to your account</h1>
    <p class="auth-sub">One card. Every department, event, and achievement.</p>

    <form id="mu-login-form" class="auth-form">
      <label class="auth-label" for="mu-login-member">Member</label>
      <select id="mu-login-member" aria-label="Select your member account">
        <option value="">— Select your member —</option>
      </select>

      <label class="auth-label" for="mu-login-pin">PIN</label>
      <div class="auth-pin-wrap">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="mu-login-pin" placeholder="Enter your PIN" autocomplete="off" aria-label="PIN" />
      </div>

      <p class="auth-hint">Demo environment — any PIN of 4 or more characters signs you in.</p>

      <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i>Sign in</button>
      <p id="mu-login-error" class="auth-error" hidden></p>
    </form>
  </div>

  <div class="auth-preview">
    <div id="mu-auth-badge"></div>
    <p class="text-faint" id="mu-auth-preview-note" style="font-size:0.85rem; text-align:center; max-width:28ch;">Pick your profile to preview your digital card.</p>
  </div>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  const select = document.getElementById("mu-login-member");
  const badgeHost = document.getElementById("mu-auth-badge");
  const previewNote = document.getElementById("mu-auth-preview-note");
  const errorEl = document.getElementById("mu-login-error");

  select.innerHTML = '<option value="">— Select your member —</option>' + MU_DATA.members.map((m) => {
    const dept = MU_DATA.deptByKey(m.dept);
    return `<option value="${m.id}">${m.name} · ${dept.short}</option>`;
  }).join("");

  select.addEventListener("change", () => {
    const m = MU_DATA.memberById(select.value);
    if (!m) {
      badgeHost.innerHTML = "";
      previewNote.textContent = "Pick your profile to preview your digital card.";
      return;
    }
    badgeHost.innerHTML = muRenderBadge(m, { size: "sm", tilt: true, sheen: true });
    previewNote.textContent = `${m.role} — you'll sign in as ${m.name}.`;
  });

  document.getElementById("mu-login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    errorEl.hidden = true;

    const memberId = select.value;
    const pin = document.getElementById("mu-login-pin").value;

    if (!memberId) {
      errorEl.textContent = "Select your member account first.";
      errorEl.hidden = false;
      return;
    }
    if (pin.length < 4) {
      errorEl.textContent = "PIN must be at least 4 characters.";
      errorEl.hidden = false;
      return;
    }

    if (muLogin(memberId)) {
      window.location.replace("index.html");
    } else {
      errorEl.textContent = "Could not start a session — is storage enabled?";
      errorEl.hidden = false;
    }
  });
</script>
</body>
</html>
