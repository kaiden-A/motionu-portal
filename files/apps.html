<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Directory · Motion-U Portals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="mu-header"></div>

<section class="section" style="padding-bottom:32px;">
  <div class="wrap">
    <span class="eyebrow">Directory</span>
    <h1 class="h-xl mt-16 text-anim" data-text-fx="soft-blur-in">Every Motion-U app, in one place</h1>
    <p class="lede mt-16">Internal tools committees run day to day, and public apps every member can open.</p>
  </div>
</section>

<section class="section--tight" style="padding-top:0;">
  <div class="wrap">
    <div class="filter-bar">
      <div class="chip-row" id="mu-cat-chips"></div>
      <div class="chip-row" id="mu-app-dept-chips"></div>
    </div>
    <div class="grid grid-3" id="mu-app-grid"></div>
  </div>
</section>

<div id="mu-footer"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="animate.js"></script>
<script>
  muInitChrome("apps.html");

  let cat = "All";
  let deptFilter = "all";

  function renderApps() {
    const filtered = MU_DATA.apps.filter((a) => {
      const matchCat = cat === "All" || a.category === cat;
      const matchDept = deptFilter === "all" || a.dept === deptFilter;
      return matchCat && matchDept;
    });

    document.getElementById("mu-app-grid").innerHTML = filtered.map((app) => {
      const dept = MU_DATA.deptByKey(app.dept);
      return `
      <div class="app-card reveal" data-dept="${app.dept}">
        <div class="app-card__icon">${muIcon(app.icon)}</div>
        <div>
          <div class="app-card__title">${app.name}</div>
          <p class="app-card__desc">${app.desc}</p>
        </div>
        <div class="app-card__footer">
          <span class="dept-tag" data-dept="${app.dept}">${dept.short}</span>
          <span class="app-card__badge ${app.category === "Public" ? "is-public" : ""}">${app.category}</span>
        </div>
      </div>`;
    }).join("");
    muInitScrollReveal();
  }

  function renderChips() {
    document.getElementById("mu-cat-chips").innerHTML = ["All", "Internal", "Public"].map(
      (c) => `<button class="chip ${cat === c ? "is-active" : ""}" data-cat="${c}">${c}</button>`
    ).join("");
    document.querySelectorAll("#mu-cat-chips .chip").forEach((btn) => {
      btn.addEventListener("click", () => { cat = btn.dataset.cat; renderChips(); renderApps(); });
    });

    const deptChips = [{ key: "all", short: "All departments" }, ...MU_DATA.departments];
    document.getElementById("mu-app-dept-chips").innerHTML = deptChips.map((d) => `
      <button class="chip ${deptFilter === d.key ? "is-active" : ""}" data-key="${d.key}" ${d.key !== "all" ? `data-dept="${d.key}"` : ""}>
        ${d.key !== "all" ? '<span class="chip-dot"></span>' : ""} ${d.short}
      </button>`).join("");
    document.querySelectorAll("#mu-app-dept-chips .chip").forEach((btn) => {
      btn.addEventListener("click", () => { deptFilter = btn.dataset.key; renderChips(); renderApps(); });
    });
  }

  renderChips();
  renderApps();
</script>
</body>
</html>
